<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" fill="none" role="img" aria-label="Stranger — Yapay Zeka Sistemleri ve Yerel Öncelikli Yazılım Geliştirici">
  <defs>
    <linearGradient id="bgDarkTr" x1="0" y1="0" x2="900" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F12" />
      <stop offset="55%" stop-color="#101619" />
      <stop offset="100%" stop-color="#0B1413" />
    </linearGradient>
    <radialGradient id="glowLeftTr" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#95D0D3" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#95D0D3" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRightTr" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#345B57" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#345B57" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentLineTr" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#95D0D3" stop-opacity="0" />
      <stop offset="30%" stop-color="#95D0D3" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#569EA1" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#345B57" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="subDarkTr" x1="200" y1="120" x2="700" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6DCE0" />
      <stop offset="52%" stop-color="#6AB8BC" />
      <stop offset="100%" stop-color="#59A896" />
    </linearGradient>
    <pattern id="gridDarkTr" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="199" rx="16" fill="url(#bgDarkTr)" stroke="#213235" />
  <rect x="1" y="1" width="898" height="198" rx="15" fill="url(#gridDarkTr)" />
  <rect x="1" y="1" width="898" height="198" rx="15" fill="url(#glowLeftTr)" />
  <rect x="1" y="1" width="898" height="198" rx="15" fill="url(#glowRightTr)" />

  <rect x="60" y="1" width="780" height="2" fill="url(#accentLineTr)" />

  <rect x="295" y="26" width="310" height="24" rx="12" fill="#0E1518" stroke="#213235" />
  <circle cx="311" cy="38" r="3.5" fill="#7CC9CC" />
  <text x="456" y="42" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">STRANGERFORGE · GELİŞTİRİCİ</text>

  <text x="450" y="102" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.8">Stranger</text>

  <text x="450" y="136" text-anchor="middle" fill="url(#subDarkTr)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0.2">Yapay Zeka Sistemleri &amp; Yerel Öncelikli Yazılım Geliştirici</text>

  <text x="450" y="168" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="500">Sıfır Bağımlı Araçlar  ·  Çevrimdışı Uygulamalar  ·  Otonom AI İş Akışları</text>
