<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" fill="none" role="img" aria-label="Stranger — Yapay Zeka Sistemleri ve Yerel Öncelikli Yazılım Geliştirici">
  <defs>
